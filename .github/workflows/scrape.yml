name: Scrape Porto de Lisboa

on:
  schedule:
    # Corre todas as horas, aos 5 minutos da hora.
    # (GitHub pode atrasar a execução em horas de pico — é normal.)
    - cron: "5 * * * *"
  workflow_dispatch:        # permite correr manualmente a partir do separador Actions

permissions:
  contents: write           # necessário para fazer commit do JSON gerado

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium (Playwright)
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lisbon_port.json
          if git diff --cached --quiet; then
            echo "Sem alterações para commit."
          else
            git commit -m "data: actualização $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
